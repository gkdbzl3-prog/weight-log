<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#f7f3fb" />
  <title>오늘 체중</title>
  <style>
    /* Soft mauve theme */
    :root {
      --bg-color: #211827;
      --bg-overlay: rgba(26, 18, 32, 0.7);
      --surface: rgba(48, 37, 58, 0.58);
      --surface-strong: rgba(55, 43, 66, 0.76);
      --ink: #f4edf7;
      --ink-soft: #d4c5dc;
      --ink-faint: #aa99b4;
      --line: rgba(222, 210, 232, 0.2);

      --accent: #c5a6f2;
      --accent-glow: rgba(197, 166, 242, 0.26);
      --accent-soft: rgba(197, 166, 242, 0.16);

      --good: #8bd7b4;
      --good-soft: rgba(139, 215, 180, 0.14);

      --warn: #eba1bd;
      --warn-soft: rgba(235, 161, 189, 0.16);

      --shadow: 0 18px 44px rgba(10, 6, 16, 0.28), 0 2px 8px rgba(10, 6, 16, 0.18);
      --shadow-hover: 0 22px 52px rgba(10, 6, 16, 0.36), 0 4px 12px rgba(10, 6, 16, 0.22);
      --shadow-floating: 0 16px 32px rgba(10, 6, 16, 0.38);
    }

    @media (prefers-color-scheme: light) {
      :root {
        color-scheme: dark;
      }
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro KR", "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;

      /* 배경: 고정된 부드러운 오로라 그라데이션 */
      background-color: var(--bg-color);
      background-image: url("/다욧토끼.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: var(--bg-overlay);
      backdrop-filter: blur(1.5px);
      z-index: 0;
    }

    @media (prefers-color-scheme: dark) {

      html,
      body {
        background-image:
          radial-gradient(at 0% 0%, rgba(60, 30, 80, 0.4) 0px, transparent 50%),
          radial-gradient(at 100% 0%, rgba(40, 30, 90, 0.4) 0px, transparent 50%);
      }
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 24px 16px 80px;
    }

    .app {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      /* 간격을 살짝 넓혀서 여유롭게 */
    }

    @media (min-width: 720px) {
      .app {
        max-width: 720px;
      }

      body {
        padding: 48px 24px;
      }
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 0 8px;
      margin-bottom: 4px;
    }

    .header h1 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--ink);
    }

    .header .streak {
      font-size: 0.85rem;
      color: var(--ink-soft);
    }

    .header .streak strong {
      color: var(--accent);
      font-weight: 700;
    }

    /* Cards (부드러운 종이 느낌) */
    .card {
      background: var(--surface);
      border: 1px solid rgba(244, 237, 247, 0.18);
      border-radius: 28px;
      /* 더 둥글고 귀엽게 */
      box-shadow: var(--shadow);
      padding: 24px;
      transition: box-shadow 0.3s ease;
      backdrop-filter: blur(18px) saturate(1.18);
      -webkit-backdrop-filter: blur(18px) saturate(1.18);
    }

    .card:hover {
      box-shadow: var(--shadow-hover);
    }

    .card-title {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--ink-faint);
      margin: 0 0 16px;
    }

    /* Wheel */
    .wheel-card {
      padding: 24px 0;
      position: relative;
    }

    .wheel-date {
      text-align: center;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--ink-soft);
      margin-bottom: 12px;
    }

    .wheel-wrap {
      position: relative;
      height: 280px;
      overflow: hidden;
      margin: 0 auto;
      max-width: 420px;
    }

    .wheel-row {
      display: flex;
      height: 100%;
      align-items: stretch;
      justify-content: center;
      gap: 4px;
      position: relative;
      z-index: 1;
    }

    .wheel-scroll {
      height: 100%;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
      -ms-overflow-style: none;
      padding: 116px 0;
      scroll-behavior: smooth;
    }

    .wheel-scroll::-webkit-scrollbar {
      display: none;
    }

    .wheel-int {
      width: 110px;
    }

    .wheel-dec {
      width: 85px;
    }

    .wheel-int .wheel-cell {
      justify-content: flex-end;
      padding-right: 8px;
    }

    .wheel-dec .wheel-cell {
      justify-content: flex-start;
      padding-left: 8px;
    }

    .wheel-dot {
      align-self: center;
      font-size: 2.4rem;
      font-weight: 700;
      color: var(--accent);
      line-height: 1;
      pointer-events: none;
      transform: translateY(0.12em);
      padding: 0 2px;
      opacity: 0.8;
    }

    .wheel-unit-fixed {
      align-self: center;
      font-size: 1rem;
      color: var(--ink-soft);
      font-weight: 600;
      margin-left: 8px;
      pointer-events: none;
    }

    .wheel-cell {
      height: 48px;
      /* 터치 영역 확대 */
      scroll-snap-align: center;
      display: flex;
      align-items: center;
      font-variant-numeric: tabular-nums;
      font-weight: 400;
      color: var(--ink-faint);
      transition: color 0.2s, font-size 0.2s, font-weight 0.2s, transform 0.2s;
      font-size: 1rem;
      user-select: none;
    }

    .wheel-cell.near {
      color: var(--ink-soft);
      font-size: 1.3rem;
    }

    .wheel-cell.adj {
      color: var(--ink);
      font-size: 1.8rem;
      font-weight: 600;
    }

    .wheel-cell.selected {
      color: var(--accent);
      font-size: 2.6rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .wheel-dec .wheel-cell.selected {
      font-size: 2.2rem;
    }

    .wheel-dec .wheel-cell.adj {
      font-size: 1.55rem;
    }

    /* 딱딱한 선 대신 부드러운 하이라이트 박스 */
    .wheel-highlight {
      position: absolute;
      left: 20px;
      right: 20px;
      top: 50%;
      height: 56px;
      transform: translateY(-50%);
      pointer-events: none;
      background: var(--accent-soft);
      border-radius: 20px;
      z-index: 0;
    }

    .wheel-fade-top,
    .wheel-fade-bot {
      position: absolute;
      left: 0;
      right: 0;
      height: 100px;
      pointer-events: none;
      z-index: 2;
    }

    .wheel-fade-top {
      top: 0;
      background: linear-gradient(var(--surface) 20%, transparent);
    }

    .wheel-fade-bot {
      bottom: 0;
      background: linear-gradient(transparent, var(--surface) 80%);
    }

    /* Buttons */
    .wheel-actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 16px;
      padding: 0 20px;
    }

    .btn {
      border: none;
      border-radius: 18px;
      /* 동글동글 */
      padding: 14px 24px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.2s, opacity 0.2s;
      font-family: inherit;
    }

    .btn:active {
      transform: scale(0.95);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #9f7bd1);
      /* 오로라 그라데이션 */
      color: #fffafd;
      flex: 1;
      box-shadow: 0 6px 16px var(--accent-glow);
      font-size: 15px;
    }

    .btn-primary:hover {
      opacity: 0.9;
      box-shadow: 0 8px 20px var(--accent-glow);
      transform: translateY(-1px);
    }

    .btn-ghost {
      background: var(--surface-strong);
      color: var(--ink);
      padding: 14px 18px;
      border: 1px solid var(--line);
    }

    .btn-ghost:hover {
      color: var(--ink);
      background: var(--bg-color);
    }

    /* Direct input panel */
    .direct-input {
      display: none;
      padding: 16px 20px 0;
      animation: drop 0.3s ease-out forwards;
    }

    .direct-input.open {
      display: block;
    }

    .direct-input input {
      width: 100%;
      padding: 16px;
      font-size: 1.6rem;
      font-weight: 700;
      border: 2px solid var(--line);
      border-radius: 18px;
      background: var(--bg-color);
      color: var(--ink);
      text-align: center;
      font-variant-numeric: tabular-nums;
      font-family: inherit;
      -moz-appearance: textfield;
      transition: all 0.2s;
    }

    .direct-input input::-webkit-outer-spin-button,
    .direct-input input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .direct-input input:focus {
      outline: none;
      border-color: var(--accent);
      background: var(--surface);
      box-shadow: 0 0 0 4px var(--accent-soft);
    }

    /* Stats row */
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .stat {
      background: var(--surface);
      border: 1px solid rgba(244, 237, 247, 0.16);
      border-radius: 24px;
      padding: 18px 12px;
      text-align: center;
      box-shadow: var(--shadow);
      transition: transform 0.2s, box-shadow 0.2s;
      backdrop-filter: blur(18px) saturate(1.18);
      -webkit-backdrop-filter: blur(18px) saturate(1.18);
    }

    .stat:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-hover);
    }

    .stat .label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--ink-faint);
      margin-bottom: 6px;
    }

    .stat .val {
      font-size: 1.2rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: var(--ink);
    }

    .stat .val.up {
      color: var(--accent);
    }

    .stat .val.down {
      color: var(--good);
    }

    .stat .sub {
      font-size: 0.75rem;
      color: var(--ink-faint);
      margin-top: 4px;
    }

    /* Goals */
    .goal {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid var(--line);
    }

    .goal:last-child {
      border-bottom: none;
    }

    .goal-meta {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .goal-name {
      font-size: 0.9rem;
      color: var(--ink-soft);
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .goal-name .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .ideal .dot {
      background: var(--accent);
    }

    .real .dot {
      background: var(--good);
    }

    .goal-bar {
      width: 100%;
      height: 8px;
      background: var(--line);
      border-radius: 999px;
      overflow: hidden;
    }

    .goal-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      /* 쫀득한 게이지 애니메이션 */
    }

    /* 그라데이션 게이지 */
    .ideal .goal-fill {
      background: linear-gradient(90deg, var(--accent), #e0c9ff);
    }

    .real .goal-fill {
      background: linear-gradient(90deg, var(--good), #b8f0d2);
    }

    .goal-val {
      text-align: right;
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      color: var(--ink);
      font-size: 1.05rem;
      min-width: 70px;
    }

    .goal-val small {
      display: block;
      font-size: 0.75rem;
      color: var(--ink-faint);
      font-weight: 500;
      margin-top: 2px;
    }

    .goal-edit-title {
      font-size: 0.8rem;
      color: var(--ink-faint);
      margin-top: 20px;
      margin-bottom: 6px;
      font-weight: 700;
    }

    .goal-edit-desc {
      font-size: 0.8rem;
      color: var(--ink-faint);
      line-height: 1.5;
      margin: 0 0 12px;
    }

    .goal-edit {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 18px;
      align-items: center;
      justify-content: center;
      background: var(--bg-color);
      padding: 13px;
      border-radius: 20px;
    }

    .goal-input-cell {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .goal-input-cell .cell-label {
      font-size: 0.85rem;
      font-weight: 500;
      font-family: inherit;
      color: var(--ink-soft);
    }

    .goal-input-cell .input-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .goal-input-cell .input-row em {
      font-style: normal;
      color: var(--ink-faint);
      font-size: 0.85rem;
      font-weight: 600;
    }

    .goal-edit input {
      width: 68px;
      padding: 8px 6px;
      border: 2px solid transparent;
      border-radius: 12px;
      background: var(--surface);
      color: var(--ink);
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      font-variant-numeric: tabular-nums;
      text-align: center;
      transition: all 0.2s;
    }

    .goal-edit input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 4px 12px var(--accent-glow);
    }

    /* Chart */
    .chart-wrap {
      position: relative;
      margin-top: 10px;
    }

    .chart-empty {
      text-align: center;
      color: var(--ink-faint);
      padding: 40px 0;
      font-size: 0.95rem;
      font-weight: 500;
    }

    svg.chart {
      display: block;
      width: 100%;
      height: 190px;
    }

    /* Recent list */
    .recent {
      max-height: 240px;
      overflow-y: auto;
      margin-top: 8px;
      padding-right: 4px;
    }

    .recent::-webkit-scrollbar {
      width: 6px;
    }

    .recent::-webkit-scrollbar-thumb {
      background: var(--line);
      border-radius: 10px;
    }

    .recent-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 12px;
      border-bottom: 1px solid var(--line);
      font-size: 0.95rem;
      border-radius: 16px;
      transition: background 0.2s;
    }

    .recent-row:hover {
      background: var(--bg-color);
    }

    .recent-row:last-child {
      border-bottom: none;
    }

    .recent-date {
      color: var(--ink-soft);
      font-weight: 600;
    }

    .recent-val {
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .recent-diff {
      font-size: 0.8rem;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 6px;
    }

    .recent-diff.up {
      color: var(--accent);
      background: var(--accent-soft);
    }

    .recent-diff.down {
      color: var(--good);
      background: var(--good-soft);
    }

    .recent-del {
      background: none;
      border: none;
      color: var(--ink-faint);
      cursor: pointer;
      font-size: 1.2rem;
      padding: 4px 8px;
      border-radius: 10px;
      transition: all 0.2s;
    }

    .recent-del:hover {
      color: var(--warn);
      background: var(--warn-soft);
    }

    /* Toast (부드러운 말풍선 형태) */
    .toast {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--ink);
      color: var(--surface);
      padding: 14px 24px;
      border-radius: 24px;
      font-size: 0.95rem;
      font-weight: 700;
      box-shadow: var(--shadow-floating);
      opacity: 0;
      transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
      z-index: 100;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Goal headline */
    .goal-summary {
      margin-bottom: 16px;
      padding-bottom: 16px;
      border-bottom: 1px dashed var(--line);
    }

    .goal-summary .head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
    }

    .goal-summary .cur {
      font-size: 1.5rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
      color: var(--ink);
    }

    .goal-summary .delta {
      font-size: 0.8rem;
      font-weight: 500;
      font-family: inherit;
      color: var(--ink-soft);
      font-variant-numeric: tabular-nums;
    }

    .goal-summary .delta strong {
      color: var(--ink);
      font-weight: 700;
    }

    @keyframes drop {
      0% {
        transform: translateY(-12px);
        opacity: 0;
      }

      60% {
        transform: translateY(2px);
        opacity: 1;
      }

      100% {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .drop {
      animation: drop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* Partner / together card */
    .partner-hint {
      font-size: 0.8rem;
      color: var(--ink-soft);
      margin: 0 0 16px;
      line-height: 1.5;
    }

    .partner-name-wrap {
      margin-bottom: 12px;
    }

    .partner-name-wrap input,
    .partner-join-row input {
      padding: 14px 16px;
      border: 2px solid var(--line);
      border-radius: 16px;
      background: var(--bg-color);
      color: var(--ink);
      font-size: 1rem;
      font-weight: 300;
      font-size: 13px;
      font-family: inherit;
      transition: all 0.2s;
      opacity: 0.5;
    }

    .partner-name-wrap input {
      width: 100%;
    }

    .partner-name-wrap input:focus,
    .partner-join-row input:focus {
      outline: none;
      border-color: var(--accent);
      background: var(--surface);
    }

    .partner-create-btn {
      width: 100%;
    }

    .partner-or {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--ink-faint);
      font-size: 0.8rem;
      font-weight: 500;
      margin: 16px 0;
    }

    .partner-or::before,
    .partner-or::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--line);
    }

    .partner-join-row {
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap;
      align-items: stretch;
      gap: 10px;
    }

    .partner-join-row input {
      flex: 1 1 auto;
      min-width: 0;
      text-align: center;
      letter-spacing: 0.15em;
      font-weight: 500;
      text-transform: uppercase;
    }

    .partner-join-row .btn {
      flex: 0 0 auto;
      padding: 14px 20px;
      white-space: nowrap;
    }

    .partner-table-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      margin-top: 8px;
    }

    .partner-table-header span {
      font-size: 0.75rem;
      color: var(--ink-faint);
      font-weight: 700;
    }

    .btn-refresh {
      background: var(--bg-color);
      border: none;
      color: var(--ink-soft);
      font-size: 1.2rem;
      cursor: pointer;
      padding: 6px 10px;
      border-radius: 10px;
      font-family: inherit;
      transition: all 0.2s;
    }

    .btn-refresh:hover {
      color: var(--accent);
      background: var(--accent-soft);
    }

    .btn-refresh:active {
      transform: rotate(180deg);
    }

    .room-code-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px;
      background: var(--bg-color);
      border-radius: 18px;
      margin-bottom: 16px;
    }

    .room-code-label {
      font-size: 0.8rem;
      color: var(--ink-soft);
      font-weight: 700;
      white-space: nowrap;
    }

    .room-code {
      flex: 1;
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 0.15em;
      font-variant-numeric: tabular-nums;
      color: var(--accent);
    }

    .btn-copy {
      background: var(--surface);
      border: 1px solid var(--accent);
      border-radius: 12px;
      padding: 8px 14px;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent);
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .btn-copy:hover {
      background: var(--accent);
      color: #fffafd;
    }

    .btn-copy:active {
      transform: scale(0.95);
    }

    .partner-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-radius: 16px;
      margin-bottom: 8px;
      background: var(--bg-color);
      transition: transform 0.2s;
    }

    .partner-row:last-child {
      margin-bottom: 0;
    }

    .partner-row:hover {
      transform: translateX(4px);
    }

    .partner-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
      flex: 1;
      min-width: 0;
    }

    .partner-name {
      font-size: 1rem;
      color: var(--ink);
      font-weight: 600;
    }

    .partner-status {
      font-size: 0.8rem;
      color: var(--ink-soft);
      font-style: italic;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.3;
    }

    .partner-status.empty {
      color: var(--ink-faint);
      font-style: normal;
      opacity: 0.6;
    }

    /* 내 한마디 입력 */
    .my-status-wrap {
      margin-bottom: 14px;
    }

    .my-status-wrap input {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--bg-color);
      color: var(--ink);
      font-size: 0.88rem;
      font-family: inherit;
      transition: border-color 0.15s, background 0.15s;
    }

    .my-status-wrap input::placeholder {
      color: var(--ink-faint);
    }

    .my-status-wrap input:focus {
      outline: none;
      border-color: var(--accent);
      background: var(--surface);
    }

    .partner-delta {
      font-size: 1.1rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      background: var(--surface);
      padding: 4px 10px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(120, 90, 180, 0.08);
    }

    .partner-delta.up {
      color: var(--accent);
    }

    .partner-delta.down {
      color: var(--good);
    }

    .partner-waiting {
      text-align: center;
      color: var(--ink-faint);
      font-size: 0.95rem;
      padding: 24px 0;
      margin: 0;
      background: var(--bg-color);
      border-radius: 16px;
    }

    .partner-leave {
      background: none;
      border: none;
      color: var(--ink-faint);
      font: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 4px;
      margin-top: 16px;
      display: block;
      padding: 0;
      transition: color 0.2s;
    }

    .partner-leave:hover {
      color: var(--warn);
    }

    /* Footer */
    .footer {
      text-align: center;
      color: var(--ink-soft);
      font-size: 0.8rem;
      margin-top: 8px;
      font-weight: 500;
    }

    .footer a,
    .footer button {
      color: var(--ink-soft);
      background: none;
      border: none;
      font: inherit;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 4px;
      padding: 4px;
      transition: color 0.2s;
    }

    .footer a:hover,
    .footer button:hover {
      color: var(--ink);
    }

    /* Desktop two-column layout */
    @media (min-width: 720px) {
      .app {
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-areas:
          "head head"
          "wheel goal"
          "stats stats"
          "chart chart"
          "recent partner"
          "foot foot";
        column-gap: 24px;
        row-gap: 24px;
      }

      .header {
        grid-area: head;
      }

      .wheel-card {
        grid-area: wheel;
      }

      .goal-card {
        grid-area: goal;
      }

      .stats {
        grid-area: stats;
      }

      .chart-card {
        grid-area: chart;
      }

      .recent-card {
        grid-area: recent;
      }

      .partner-card {
        grid-area: partner;
      }

      .footer {
        grid-area: foot;
      }
    }
  </style>
</head>

<body>
  <div class="app">

    <div class="header">
      <h1>오늘 체중</h1>
      <div class="streak" id="streak"></div>
    </div>

    <div class="card wheel-card">
      <div class="wheel-date" id="wheelDate"></div>
      <div class="wheel-wrap">
        <div class="wheel-fade-top"></div>
        <div class="wheel-fade-bot"></div>
        <div class="wheel-highlight"></div>
        <div class="wheel-row">
          <div class="wheel-scroll wheel-int" id="wheelInt"></div>
          <div class="wheel-dot">.</div>
          <div class="wheel-scroll wheel-dec" id="wheelDec"></div>
          <div class="wheel-unit-fixed">kg</div>
        </div>
      </div>
      <div class="wheel-actions">
        <button class="btn btn-ghost" id="directBtn">직접 입력</button>
        <button class="btn btn-primary" id="saveBtn">기록</button>
      </div>
      <div class="direct-input" id="directInputWrap">
        <input type="number" step="0.01" id="directInput" placeholder="kg" inputmode="decimal" />
      </div>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="label">어제 대비</div>
        <div class="val" id="diffYday">–</div>
        <div class="sub" id="ydayDate"></div>
      </div>
      <div class="stat">
        <div class="label">7일 전 대비</div>
        <div class="val" id="diffWeek">–</div>
        <div class="sub">한 주</div>
      </div>
      <div class="stat">
        <div class="label">시작 대비</div>
        <div class="val" id="diffStart">–</div>
        <div class="sub" id="startDate"></div>
      </div>
    </div>

    <div class="card goal-card">
      <h3 class="card-title">목표</h3>

      <div class="goal-summary">
        <div class="head">
          <div class="cur" id="goalCur">– kg</div>
          <div class="delta" id="goalDelta"></div>
        </div>
      </div>

      <div class="goal ideal">
        <div class="goal-meta">
          <div class="goal-name"><span class="dot"></span>위시 목표</div>
          <div class="goal-bar">
            <div class="goal-fill" id="idealBar" style="width:0%"></div>
          </div>
        </div>
        <div class="goal-val" id="idealVal">– kg<small id="idealSub"></small></div>
      </div>
      <div class="goal real">
        <div class="goal-meta">
          <div class="goal-name"><span class="dot"></span>현실 목표</div>
          <div class="goal-bar">
            <div class="goal-fill" id="realBar" style="width:0%"></div>
          </div>
        </div>
        <div class="goal-val" id="realVal">– kg<small id="realSub"></small></div>
      </div>

      <div class="goal-edit-title">설정</div>
      <p class="goal-edit-desc">한 번만 입력해 두면 목표까지 진행률이 자동으로 계산돼요.</p>
      <div class="goal-edit">
        <label class="goal-input-cell">
          <span class="cell-label">시작</span>
          <div class="input-row"><input type="number" step="0.01" id="startInput" /><em>kg</em></div>
        </label>
        <label class="goal-input-cell">
          <span class="cell-label">위시</span>
          <div class="input-row"><input type="number" step="0.01" id="idealInput" /><em>kg</em></div>
        </label>
        <label class="goal-input-cell">
          <span class="cell-label">현실</span>
          <div class="input-row"><input type="number" step="0.01" id="realInput" /><em>kg</em></div>
        </label>
        <label class="goal-input-cell">
          <span class="cell-label">기간</span>
          <div class="input-row"><input type="number" step="1" id="weeksInput" min="1" /><em>주</em></div>
        </label>
      </div>
    </div>

    <div class="card chart-card">
      <h3 class="card-title">최근 30일</h3>
      <div class="chart-wrap" id="chartWrap">
        <div class="chart-empty">아직 기록이 없어요. 첫 기록을 남겨봐요.</div>
      </div>
    </div>

    <div class="card recent-card">
      <h3 class="card-title">기록</h3>
      <div class="recent" id="recent"></div>
    </div>

    <div class="card partner-card">
      <h3 class="card-title">같이 하기 🤝</h3>

      <div id="partnerSetup">
        <p class="partner-hint">체중은 비공개 — 시작 대비 변화량(±kg)만 친구에게 보여요.</p>
        <div class="partner-name-wrap">
          <input type="text" id="partnerMyName" placeholder="내 닉네임" maxlength="10" />
        </div>
        <button class="btn btn-primary partner-create-btn" id="createRoomBtn">방 만들기</button>
        <div class="partner-or">또는</div>
        <div class="partner-join-row">
          <input type="text" id="joinCodeInput" placeholder="친구한테 받은 코드" maxlength="6" />
          <button class="btn btn-ghost" id="joinRoomBtn">참여</button>
        </div>
      </div>

      <div id="partnerRoom" style="display:none">
        <div class="room-code-row">
          <span class="room-code-label">방 코드</span>
          <span class="room-code" id="roomCodeDisplay">------</span>
          <button class="btn-copy" id="copyCodeBtn">복사</button>
        </div>
        <div class="my-status-wrap">
          <input type="text" id="myStatusInput" placeholder="오늘 한마디 💬 (예: 폭식했어 ㅠ)" maxlength="40" />
        </div>
        <div class="partner-table-header">
          <span>시작 대비 변화량</span>
          <button class="btn-refresh" id="refreshPartnerBtn" title="새로고침">↻</button>
        </div>
        <div id="partnerTable"></div>
        <button class="partner-leave" id="leaveRoomBtn">방 나가기</button>
      </div>
    </div>

    <div class="footer">
      데이터는 이 브라우저에만 저장돼요. ·
      <button id="exportBtn">JSON 내보내기</button> ·
      <label style="cursor:pointer;text-decoration:underline;text-underline-offset:2px;">
        불러오기<input type="file" id="importInput" accept="application/json" style="display:none" />
      </label> ·
      <button id="clearBtn">전체 삭제</button>
    </div>
  </div>

  <div class="toast" id="toast">저장됨</div>

  <script>
    (() => {
      'use strict';

      const STORAGE_KEY = 'weightLog.v1';
      const INT_MIN = 30;
      const INT_MAX = 200;
      const CELL_H = 48;

      // ---- Storage ----
      const defaultState = {
        entries: [],         // [{date:'YYYY-MM-DD', kg:75.4, ts:number}]
        settings: { startKg: 75, idealKg: 65, realKg: 70, weeks: 8 }
      };
      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return structuredClone(defaultState);
          const obj = JSON.parse(raw);
          return { ...structuredClone(defaultState), ...obj, settings: { ...defaultState.settings, ...(obj.settings || {}) } };
        } catch { return structuredClone(defaultState); }
      }
      function saveState(s) { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); }
      let state = loadState();

      // ---- Helpers ----
      const fmtDate = d => {
        if (typeof d === 'string') d = new Date(d + 'T00:00:00');
        return d.toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'short' });
      };
      const todayStr = () => {
        const d = new Date();
        const pad = n => String(n).padStart(2, '0');
        return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
      };
      const daysAgoStr = n => {
        const d = new Date();
        d.setDate(d.getDate() - n);
        const pad = x => String(x).padStart(2, '0');
        return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
      };
      const round1 = x => Math.round(x * 10) / 10;
      const round2 = x => Math.round(x * 100) / 100;
      const splitVal = v => {
        const r = round2(v);
        const intP = Math.floor(r);
        const decP = Math.round((r - intP) * 100);
        return { intP, decP };
      };
      const sortedEntries = () => [...state.entries].sort((a, b) => a.date.localeCompare(b.date));
      const lastEntry = () => {
        const e = sortedEntries();
        return e.length ? e[e.length - 1] : null;
      };

      // ---- Wheel (dual: integer + 2-digit decimal) ----
      const wheelInt = document.getElementById('wheelInt');
      const wheelDec = document.getElementById('wheelDec');
      const wheelDate = document.getElementById('wheelDate');
      let intCells = [], decCells = [];
      let curInt = null, curDec = null;
      let intRaf = null, decRaf = null;

      function currentValue() {
        if (curInt == null || curDec == null) return null;
        return round2(curInt + curDec / 100);
      }

      function buildWheelStrip(container, min, max, formatter) {
        container.innerHTML = '';
        const cells = [];
        const frag = document.createDocumentFragment();
        for (let v = min; v <= max; v++) {
          const div = document.createElement('div');
          div.className = 'wheel-cell';
          div.dataset.val = String(v);
          div.textContent = formatter(v);
          div.addEventListener('click', () => scrollStripTo(container, v, min, true));
          frag.appendChild(div);
          cells.push(div);
        }
        container.appendChild(frag);
        return cells;
      }

      function scrollStripTo(container, value, min, smooth) {
        const idx = value - min;
        container.scrollTo({ top: idx * CELL_H, behavior: smooth ? 'smooth' : 'auto' });
      }

      function scrollToValue(v, smooth) {
        const { intP, decP } = splitVal(v);
        const intClamp = Math.max(INT_MIN, Math.min(INT_MAX, intP));
        scrollStripTo(wheelInt, intClamp, INT_MIN, smooth);
        scrollStripTo(wheelDec, decP, 0, smooth);
      }

      function updateStripStyles(cells, centerIdx) {
        const range = 4;
        for (let i = Math.max(0, centerIdx - range); i <= Math.min(cells.length - 1, centerIdx + range); i++) {
          const c = cells[i];
          c.classList.remove('selected', 'adj', 'near');
          const d = Math.abs(i - centerIdx);
          if (d === 0) c.classList.add('selected');
          else if (d === 1) c.classList.add('adj');
          else if (d === 2) c.classList.add('near');
        }
        for (const off of [range + 1, range + 2]) {
          const a = cells[centerIdx - off];
          const b = cells[centerIdx + off];
          if (a) a.classList.remove('selected', 'adj', 'near');
          if (b) b.classList.remove('selected', 'adj', 'near');
        }
      }

      function onIntScroll() {
        if (intRaf) return;
        intRaf = requestAnimationFrame(() => {
          intRaf = null;
          const centerIdx = Math.round(wheelInt.scrollTop / CELL_H);
          const clamped = Math.max(0, Math.min(intCells.length - 1, centerIdx));
          const v = INT_MIN + clamped;
          if (v !== curInt) {
            curInt = v;
            updateStripStyles(intCells, clamped);
          }
        });
      }
      function onDecScroll() {
        if (decRaf) return;
        decRaf = requestAnimationFrame(() => {
          decRaf = null;
          const centerIdx = Math.round(wheelDec.scrollTop / CELL_H);
          const clamped = Math.max(0, Math.min(decCells.length - 1, centerIdx));
          if (clamped !== curDec) {
            curDec = clamped;
            updateStripStyles(decCells, clamped);
          }
        });
      }

      wheelInt.addEventListener('scroll', onIntScroll, { passive: true });
      wheelDec.addEventListener('scroll', onDecScroll, { passive: true });

      // Mouse wheel: scroll the strip the cursor is over
      function bindMouseWheel(el) {
        el.addEventListener('wheel', (e) => {
          e.preventDefault();
          el.scrollBy({ top: e.deltaY > 0 ? CELL_H : -CELL_H, behavior: 'smooth' });
        }, { passive: false });
      }
      bindMouseWheel(wheelInt);
      bindMouseWheel(wheelDec);

      // ---- Direct input ----
      const directBtn = document.getElementById('directBtn');
      const directWrap = document.getElementById('directInputWrap');
      const directInput = document.getElementById('directInput');
      directBtn.addEventListener('click', () => {
        const open = directWrap.classList.toggle('open');
        if (open) {
          const cv = currentValue();
          directInput.value = cv != null ? cv.toFixed(2) : '';
          directInput.focus();
          directInput.select();
        }
      });
      directInput.addEventListener('change', () => {
        const v = parseFloat(directInput.value);
        if (!isNaN(v) && v >= INT_MIN && v < INT_MAX + 1) {
          scrollToValue(round2(v), true);
        }
      });

      // ---- Save ----
      const saveBtn = document.getElementById('saveBtn');
      saveBtn.addEventListener('click', () => {
        const cv = currentValue();
        if (cv == null) return;
        const date = todayStr();
        // Replace today's entry if it exists
        const i = state.entries.findIndex(e => e.date === date);
        const entry = { date, kg: cv, ts: Date.now() };
        if (i >= 0) state.entries[i] = entry;
        else state.entries.push(entry);
        saveState(state);
        renderAll();
        pushSelf();
        showToast(i >= 0 ? `오늘 기록 수정됨 · ${cv.toFixed(2)}kg` : `저장됨 · ${cv.toFixed(2)}kg`);
        // Drop animation on both wheels' selected cells
        [wheelInt, wheelDec].forEach(w => {
          const sel = w.querySelector('.wheel-cell.selected');
          if (sel) { sel.classList.remove('drop'); void sel.offsetWidth; sel.classList.add('drop'); }
        });
      });

      // ---- Stats / Goals / Recent ----
      function renderStreak() {
        const el = document.getElementById('streak');
        const e = sortedEntries();
        if (!e.length) { el.textContent = '아직 기록 없음'; return; }
        // Consecutive days backwards from today (or from last entry if today missing)
        const dates = new Set(e.map(x => x.date));
        let streak = 0;
        let cur = new Date();
        // If today isn't logged but yesterday is, still count yesterday-back
        if (!dates.has(todayStr())) cur.setDate(cur.getDate() - 1);
        while (true) {
          const pad = n => String(n).padStart(2, '0');
          const s = `${cur.getFullYear()}-${pad(cur.getMonth() + 1)}-${pad(cur.getDate())}`;
          if (dates.has(s)) { streak++; cur.setDate(cur.getDate() - 1); }
          else break;
        }
        el.innerHTML = streak > 0 ? `<strong>${streak}일째</strong> 기록 중` : `오늘 기록 안 함`;
      }

      function renderStats() {
        const last = lastEntry();
        const e = sortedEntries();

        const setStat = (id, kgDiff, opts = {}) => {
          const el = document.getElementById(id);
          if (kgDiff == null || isNaN(kgDiff)) { el.textContent = '–'; el.className = 'val'; return; }
          const sign = kgDiff > 0 ? '+' : '';
          el.textContent = `${sign}${kgDiff.toFixed(2)} kg`;
          el.className = 'val ' + (kgDiff > 0 ? 'up' : kgDiff < 0 ? 'down' : '');
        };

        // Yesterday
        const yday = daysAgoStr(1);
        const ydayE = e.find(x => x.date === yday);
        const ydayEl = document.getElementById('ydayDate');
        ydayEl.textContent = ydayE ? `어제 ${ydayE.kg.toFixed(2)}kg` : '어제 기록 없음';
        setStat('diffYday', last && ydayE ? round2(last.kg - ydayE.kg) : null);

        // 7 days ago — use closest entry within last 7 days at oldest
        let weekAgoE = null;
        for (let d = 7; d <= 10; d++) {
          const s = daysAgoStr(d);
          weekAgoE = e.find(x => x.date === s);
          if (weekAgoE) break;
        }
        setStat('diffWeek', last && weekAgoE ? round2(last.kg - weekAgoE.kg) : null);

        // Start
        const startE = e[0];
        const startDateEl = document.getElementById('startDate');
        startDateEl.textContent = startE ? `${startE.date.slice(5).replace('-', '/')} 부터` : '시작 기록 없음';
        setStat('diffStart', last && startE ? round2(last.kg - startE.kg) : null);
      }

      function renderGoals() {
        const s = state.settings;
        const last = lastEntry();
        const cur = last ? last.kg : s.startKg;

        document.getElementById('goalCur').textContent = `${cur.toFixed(2)} kg`;
        const deltaStart = round2(cur - s.startKg);
        const deltaEl = document.getElementById('goalDelta');
        if (Math.abs(deltaStart) < 0.005) {
          deltaEl.innerHTML = `시작 ${s.startKg.toFixed(2)}kg에서 <strong>변화 없음</strong>`;
        } else {
          const sign = deltaStart > 0 ? '+' : '';
          deltaEl.innerHTML = `시작 ${s.startKg.toFixed(2)}kg에서 <strong>${sign}${deltaStart.toFixed(2)}kg</strong>`;
        }

        const pct = (goalKg) => {
          const total = s.startKg - goalKg;
          const done = s.startKg - cur;
          if (total === 0) return 100;
          let p = (done / total) * 100;
          // If goal is to lose (total > 0): clamp 0–100. If goal is to gain (total < 0), invert.
          if (total < 0) p = (done / total) * 100;
          return Math.max(0, Math.min(100, p));
        };

        const idealPct = pct(s.idealKg);
        const realPct = pct(s.realKg);

        document.getElementById('idealBar').style.width = idealPct + '%';
        document.getElementById('realBar').style.width = realPct + '%';

        const remainIdeal = round2(cur - s.idealKg);
        const remainReal = round2(cur - s.realKg);

        document.getElementById('idealVal').innerHTML =
          `${s.idealKg.toFixed(2)} kg<small>${remainIdeal > 0 ? `${remainIdeal.toFixed(2)}kg 남음` : remainIdeal < 0 ? '달성 🎉' : '딱 맞음'} · ${s.weeks}주</small>`;
        document.getElementById('realVal').innerHTML =
          `${s.realKg.toFixed(2)} kg<small>${remainReal > 0 ? `${remainReal.toFixed(2)}kg 남음` : remainReal < 0 ? '달성 🎉' : '딱 맞음'} · ${s.weeks}주</small>`;

        document.getElementById('startInput').value = s.startKg.toFixed(2);
        document.getElementById('idealInput').value = s.idealKg.toFixed(2);
        document.getElementById('realInput').value = s.realKg.toFixed(2);
        document.getElementById('weeksInput').value = s.weeks;
      }

      function renderChart() {
        const wrap = document.getElementById('chartWrap');
        const e = sortedEntries();
        if (!e.length) {
          wrap.innerHTML = '<div class="chart-empty">아직 기록이 없어요. 첫 기록을 남겨봐요.</div>';
          return;
        }
        // Filter last 30 days window
        const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - 29);
        const data = e.filter(x => new Date(x.date + 'T00:00:00') >= cutoff);
        if (data.length < 2) {
          wrap.innerHTML = '<div class="chart-empty">기록이 하나뿐이에요. 내일 한 번 더 재 보세요.</div>';
          return;
        }
        const W = 600, H = 180, P = 24;
        const xs = data.map(d => new Date(d.date + 'T00:00:00').getTime());
        const ys = data.map(d => d.kg);
        const minX = Math.min(...xs), maxX = Math.max(...xs);
        const padY = 0.6;
        const minY = Math.min(...ys, state.settings.idealKg, state.settings.realKg) - padY;
        const maxY = Math.max(...ys, state.settings.startKg) + padY;
        const sx = x => P + ((x - minX) / Math.max(1, maxX - minX)) * (W - P * 2);
        const sy = y => H - P - ((y - minY) / Math.max(0.1, maxY - minY)) * (H - P * 2);

        const linePath = data.map((d, i) => {
          const x = sx(new Date(d.date + 'T00:00:00').getTime());
          const y = sy(d.kg);
          return (i === 0 ? 'M' : 'L') + x.toFixed(1) + ' ' + y.toFixed(1);
        }).join(' ');

        const areaPath = linePath + ` L ${sx(maxX).toFixed(1)} ${H - P} L ${sx(minX).toFixed(1)} ${H - P} Z`;

        const idealY = sy(state.settings.idealKg);
        const realY = sy(state.settings.realKg);

        const dots = data.map(d => {
          const x = sx(new Date(d.date + 'T00:00:00').getTime());
          const y = sy(d.kg);
          return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.5" fill="var(--accent)" />`;
        }).join('');

        wrap.innerHTML = `
      <svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
        <defs>
          <linearGradient id="grad" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0%" stop-color="var(--accent)" stop-opacity="0.20"/>
            <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <line x1="${P}" x2="${W - P}" y1="${idealY.toFixed(1)}" y2="${idealY.toFixed(1)}"
              stroke="var(--accent)" stroke-width="1" stroke-dasharray="3 4" opacity="0.5"/>
        <line x1="${P}" x2="${W - P}" y1="${realY.toFixed(1)}"  y2="${realY.toFixed(1)}"
              stroke="var(--good)"   stroke-width="1" stroke-dasharray="3 4" opacity="0.5"/>
        <text x="${W - P}" y="${(idealY - 4).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--accent)" opacity="0.8">위시 ${state.settings.idealKg.toFixed(2)}</text>
        <text x="${W - P}" y="${(realY - 4).toFixed(1)}"  text-anchor="end" font-size="10" fill="var(--good)"   opacity="0.8">현실 ${state.settings.realKg.toFixed(2)}</text>
        <path d="${areaPath}" fill="url(#grad)" />
        <path d="${linePath}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
        ${dots}
      </svg>
    `;
      }

      function renderRecent() {
        const list = document.getElementById('recent');
        const e = sortedEntries().slice().reverse();
        if (!e.length) {
          list.innerHTML = '<div style="color:var(--ink-faint);padding:20px 0;text-align:center;font-size:0.9rem">기록이 쌓이면 여기에 보여요.</div>';
          return;
        }
        list.innerHTML = e.map((x, idx) => {
          const prev = e[idx + 1];
          let diffStr = '';
          if (prev) {
            const d = round2(x.kg - prev.kg);
            if (Math.abs(d) >= 0.005) {
              const cls = d > 0 ? 'up' : 'down';
              const sign = d > 0 ? '+' : '';
              diffStr = `<span class="recent-diff ${cls}">${sign}${d.toFixed(2)}</span>`;
            }
          }
          return `
        <div class="recent-row">
          <div class="recent-date">${fmtDate(x.date)}</div>
          <div class="recent-val">${x.kg.toFixed(2)} kg ${diffStr}
            <button class="recent-del" data-date="${x.date}" title="삭제">×</button>
          </div>
        </div>`;
        }).join('');
        list.querySelectorAll('.recent-del').forEach(b => {
          b.addEventListener('click', () => {
            const d = b.dataset.date;
            if (confirm(`${d} 기록을 삭제할까요?`)) {
              state.entries = state.entries.filter(x => x.date !== d);
              saveState(state);
              renderAll();
            }
          });
        });
      }

      // ---- Settings editing (debounced) ----
      let saveTimer = null;
      function bindSettingInput(id, key) {
        const el = document.getElementById(id);
        el.addEventListener('input', () => {
          const v = parseFloat(el.value);
          if (!isNaN(v)) {
            state.settings[key] = key === 'weeks' ? Math.max(1, Math.round(v)) : round2(v);
            clearTimeout(saveTimer);
            saveTimer = setTimeout(() => { saveState(state); }, 300);
            renderGoals();
            renderChart();
          }
        });
      }
      bindSettingInput('startInput', 'startKg');
      bindSettingInput('idealInput', 'idealKg');
      bindSettingInput('realInput', 'realKg');
      bindSettingInput('weeksInput', 'weeks');

      // ---- Toast ----
      const toast = document.getElementById('toast');
      let toastTimer = null;
      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('show'), 1600);
      }

      // ---- Export / Import / Clear ----
      document.getElementById('exportBtn').addEventListener('click', () => {
        const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `weight-log-${todayStr()}.json`;
        a.click();
        URL.revokeObjectURL(url);
      });
      document.getElementById('importInput').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        try {
          const text = await file.text();
          const obj = JSON.parse(text);
          if (!Array.isArray(obj.entries)) throw new Error('invalid');
          if (!confirm('현재 데이터를 덮어쓸까요?')) return;
          state = { ...defaultState, ...obj, settings: { ...defaultState.settings, ...(obj.settings || {}) } };
          saveState(state);
          renderAll();
          showToast('불러옴');
        } catch {
          alert('파일을 읽지 못했어요.');
        }
        e.target.value = '';
      });
      document.getElementById('clearBtn').addEventListener('click', () => {
        if (!confirm('정말로 모든 기록을 삭제할까요? 되돌릴 수 없어요.')) return;
        state = structuredClone(defaultState);
        saveState(state);
        renderAll();
        showToast('초기화됨');
      });

      // ---- Render ----
      function renderAll() {
        renderStreak();
        renderStats();
        renderGoals();
        renderChart();
        renderRecent();
        // Wheel date label
        const today = new Date();
        wheelDate.textContent = today.toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'long' });
      }

      // ---- Init ----
      intCells = buildWheelStrip(wheelInt, INT_MIN, INT_MAX, v => String(v));
      decCells = buildWheelStrip(wheelDec, 0, 99, v => String(v).padStart(2, '0'));
      renderAll();

      // Initial wheel position: last entry, else start setting, else 70
      const last = lastEntry();
      const initial = round2(last ? last.kg : (state.settings.startKg || 70));
      requestAnimationFrame(() => {
        scrollToValue(initial, false);
        setTimeout(() => {
          const { intP, decP } = splitVal(initial);
          curInt = Math.max(INT_MIN, Math.min(INT_MAX, intP));
          curDec = decP;
          updateStripStyles(intCells, curInt - INT_MIN);
          updateStripStyles(decCells, curDec);
        }, 60);
      });

      // ---- Partner / Together feature ----
      const PARTNER_KEY = 'weightRoom.partner.v1';
      let partnerState = { code: null, slot: null, name: '나', status: '' };

      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, (c) => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        })[c]);
      }
      let pollTimer = null;

      function loadPartnerState() {
        try {
          const raw = localStorage.getItem(PARTNER_KEY);
          if (raw) partnerState = { ...partnerState, ...JSON.parse(raw) };
        } catch { }
      }

      function savePartnerState() {
        localStorage.setItem(PARTNER_KEY, JSON.stringify(partnerState));
      }

      function myDelta() {
        const last = lastEntry();
        if (!last) return null;
        return round2(last.kg - state.settings.startKg);
      }

      async function pushSelf() {
        if (!partnerState.code || !partnerState.slot) return;
        const delta = myDelta();
        const body = {
          name: partnerState.name,
          status: partnerState.status || '',
        };
        if (delta !== null) body.delta = delta;
        try {
          await fetch(`/api/room/${partnerState.code}/${partnerState.slot}`, {
            method: 'PUT',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify(body),
          });
        } catch { }
      }

      async function fetchPartnerData() {
        if (!partnerState.code) return;
        try {
          const res = await fetch(`/api/room/${partnerState.code}`);
          if (res.ok) {
            const data = await res.json();
            renderPartnerTable(data);
          }
        } catch { }
      }

      function renderPartnerTable(data) {
        const table = document.getElementById('partnerTable');
        const slots = ['slot1', 'slot2'];
        const rows = slots.map((s) => {
          const m = data[s];
          if (!m) return null;
          const isMe = s === partnerState.slot;
          const sign = m.delta > 0 ? '+' : '';
          const cls = m.delta > 0 ? 'up' : m.delta < 0 ? 'down' : '';
          const name = escapeHtml(m.name || '');
          const statusText = m.status
            ? `<span class="partner-status">"${escapeHtml(m.status)}"</span>`
            : (isMe
              ? `<span class="partner-status empty">한마디 남겨봐요</span>`
              : `<span class="partner-status empty">아직 조용해요</span>`);
          return `<div class="partner-row">
        <div class="partner-info">
          <span class="partner-name">${name}${isMe ? ' (나)' : ''}</span>
          ${statusText}
        </div>
        <span class="partner-delta ${cls}">${sign}${m.delta.toFixed(2)} kg</span>
      </div>`;
        }).filter(Boolean);
        table.innerHTML = rows.length
          ? rows.join('')
          : '<p class="partner-waiting">친구가 아직 참여하지 않았어요.</p>';
      }

      function startPolling() {
        if (pollTimer) return;
        pollTimer = setInterval(fetchPartnerData, 30000);
      }

      function stopPolling() {
        if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
      }

      function renderPartner() {
        const setup = document.getElementById('partnerSetup');
        const room = document.getElementById('partnerRoom');
        if (partnerState.code) {
          setup.style.display = 'none';
          room.style.display = 'block';
          document.getElementById('roomCodeDisplay').textContent = partnerState.code;
          const si = document.getElementById('myStatusInput');
          if (si) si.value = partnerState.status || '';
          fetchPartnerData();
          startPolling();
        } else {
          setup.style.display = 'block';
          room.style.display = 'none';
          stopPolling();
        }
      }

      document.getElementById('createRoomBtn').addEventListener('click', async () => {
        const name = document.getElementById('partnerMyName').value.trim() || '나';
        try {
          const res = await fetch('/api/room', { method: 'POST' });
          const data = await res.json();
          partnerState = { code: data.code, slot: data.slot, name, status: '' };
          savePartnerState();
          renderPartner();
          await pushSelf();
          showToast(`방 만들었어! 코드: ${data.code}`);
        } catch {
          showToast('오류가 났어요. 다시 시도해 봐요.');
        }
      });

      document.getElementById('joinRoomBtn').addEventListener('click', async () => {
        const code = document.getElementById('joinCodeInput').value.trim().toUpperCase();
        if (code.length < 6) { showToast('6자리 코드를 입력해 봐요.'); return; }
        const name = document.getElementById('partnerMyName').value.trim() || '나';
        try {
          const res = await fetch(`/api/room/${code}/join`, { method: 'POST' });
          if (!res.ok) {
            const err = await res.json();
            showToast(err.error || '참여할 수 없어요.');
            return;
          }
          const data = await res.json();
          partnerState = { code, slot: data.slot, name, status: '' };
          savePartnerState();
          renderPartner();
          await pushSelf();
          showToast(`방에 참여했어! 코드: ${code}`);
        } catch {
          showToast('오류가 났어요.');
        }
      });

      document.getElementById('copyCodeBtn').addEventListener('click', () => {
        navigator.clipboard?.writeText(partnerState.code).then(() => showToast('코드 복사됨!'));
      });

      document.getElementById('refreshPartnerBtn').addEventListener('click', () => {
        fetchPartnerData();
      });

      document.getElementById('leaveRoomBtn').addEventListener('click', () => {
        if (!confirm('방에서 나갈까요?')) return;
        partnerState = { code: null, slot: null, name: partnerState.name, status: '' };
        savePartnerState();
        renderPartner();
      });

      const myStatusInput = document.getElementById('myStatusInput');

      async function saveMyStatus() {
        const v = myStatusInput.value.trim().slice(0, 40);
        if (v === (partnerState.status || '')) return;
        partnerState.status = v;
        savePartnerState();
        await pushSelf();
        fetchPartnerData();
      }

      myStatusInput.addEventListener('blur', saveMyStatus);
      myStatusInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); myStatusInput.blur(); }
      });

      loadPartnerState();
      myStatusInput.value = partnerState.status || '';
      renderPartner();

      // Keyboard shortcuts (desktop nicety)
      document.addEventListener('keydown', (e) => {
        if (document.activeElement && (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA')) return;
        // Shift+arrows scroll decimal wheel, plain arrows scroll integer
        if (e.key === 'ArrowUp') { e.preventDefault(); (e.shiftKey ? wheelDec : wheelInt).scrollBy({ top: -CELL_H, behavior: 'smooth' }); }
        if (e.key === 'ArrowDown') { e.preventDefault(); (e.shiftKey ? wheelDec : wheelInt).scrollBy({ top: CELL_H, behavior: 'smooth' }); }
        if (e.key === 'ArrowLeft') { e.preventDefault(); wheelInt.scrollBy({ top: -CELL_H, behavior: 'smooth' }); }
        if (e.key === 'ArrowRight') { e.preventDefault(); wheelInt.scrollBy({ top: CELL_H, behavior: 'smooth' }); }
        if (e.key === 'Enter') { e.preventDefault(); saveBtn.click(); }
      });
    })();
  </script>
</body>

</html>
