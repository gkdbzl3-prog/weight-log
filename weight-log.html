<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f8f7f3" />
  <title>Weight Room</title>
  <style>
    :root {
      --bg: #f8f7f3;
      --surface: #fffdfa;
      --ink: #27231f;
      --muted: #756d64;
      --faint: #aaa198;
      --line: #e8e1d8;
      --accent: #d85f43;
      --accent-soft: #fae4dc;
      --good: #3d8b67;
      --good-soft: #e0f0e8;
      --shadow: 0 12px 34px rgba(54, 43, 31, .08), 0 1px 2px rgba(54, 43, 31, .06);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #15130f;
        --surface: #211d18;
        --ink: #f5eee6;
        --muted: #b2a79a;
        --faint: #70675d;
        --line: #332d25;
        --accent: #ec7b5c;
        --accent-soft: #3a231b;
        --good: #79c49b;
        --good-soft: #1f3429;
        --shadow: 0 16px 36px rgba(0, 0, 0, .28);
      }
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro KR", "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button, input, textarea { font: inherit; }
    .app {
      width: min(960px, 100%);
      margin: 0 auto;
      padding: 28px 16px 48px;
      display: grid;
      gap: 16px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: flex-end;
      padding: 4px 2px 0;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.5rem, 5vw, 2.35rem);
      letter-spacing: 0;
    }

    .room {
      color: var(--muted);
      font-size: .88rem;
      text-align: right;
      line-height: 1.45;
    }

    .grid {
      display: grid;
      gap: 16px;
    }

    @media (min-width: 820px) {
      .grid {
        grid-template-columns: 360px 1fr;
        align-items: start;
      }
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 18px;
    }

    .title {
      margin: 0 0 14px;
      color: var(--faint);
      font-size: .76rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .profile {
      display: grid;
      grid-template-columns: 1fr 112px;
      gap: 10px;
    }

    .field {
      display: grid;
      gap: 6px;
      margin-bottom: 12px;
    }

    label {
      color: var(--muted);
      font-size: .82rem;
      font-weight: 650;
    }

    input, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--bg);
      color: var(--ink);
      padding: 12px 13px;
      outline: none;
    }

    textarea {
      min-height: 76px;
      resize: vertical;
      line-height: 1.45;
    }

    input:focus, textarea:focus { border-color: var(--accent); }

    .actions {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 12px;
    }

    .btn {
      border: 0;
      border-radius: 8px;
      padding: 12px 15px;
      font-weight: 750;
      cursor: pointer;
    }

    .btn.primary {
      background: var(--accent);
      color: white;
      flex: 1;
    }

    .btn.secondary {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .hint {
      color: var(--faint);
      font-size: .78rem;
      line-height: 1.45;
      margin: 8px 0 0;
    }

    .me-summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 14px;
    }

    .metric {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      min-width: 0;
    }

    .metric span {
      display: block;
      color: var(--faint);
      font-size: .72rem;
      margin-bottom: 4px;
    }

    .metric strong {
      display: block;
      font-variant-numeric: tabular-nums;
      font-size: 1rem;
      white-space: nowrap;
    }

    .members {
      display: grid;
      gap: 12px;
    }

    .member {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      display: grid;
      gap: 12px;
    }

    .member-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
    }

    .name {
      font-size: 1.08rem;
      font-weight: 800;
    }

    .updated {
      color: var(--faint);
      font-size: .76rem;
      white-space: nowrap;
    }

    .delta-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .delta {
      background: var(--bg);
      border-radius: 8px;
      padding: 10px;
    }

    .delta small {
      display: block;
      color: var(--faint);
      font-size: .7rem;
      margin-bottom: 3px;
    }

    .delta b {
      font-size: 1.05rem;
      font-variant-numeric: tabular-nums;
    }

    .up { color: var(--accent); }
    .down { color: var(--good); }

    .bubble {
      position: relative;
      width: fit-content;
      max-width: 100%;
      background: var(--good-soft);
      color: var(--ink);
      border-radius: 8px;
      padding: 11px 13px;
      line-height: 1.45;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }

    .bubble::before {
      content: "";
      position: absolute;
      left: 16px;
      top: -7px;
      border-left: 7px solid transparent;
      border-right: 7px solid transparent;
      border-bottom: 7px solid var(--good-soft);
    }

    .empty {
      color: var(--faint);
      padding: 34px 0;
      text-align: center;
      line-height: 1.5;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%) translateY(16px);
      background: var(--ink);
      color: var(--surface);
      padding: 11px 16px;
      border-radius: 999px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s, transform .2s;
      font-weight: 700;
      font-size: .9rem;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="top">
      <div>
        <h1>Weight Room</h1>
        <p class="hint">실제 체중은 내 화면 입력용으로만 쓰고, 친구에게는 +n/-n 변화량과 상태메시지만 보여줘요.</p>
      </div>
      <div class="room">
        방 <strong id="roomName">default</strong><br />
        URL의 <code>?room=</code> 값으로 방을 나눠요.
      </div>
    </header>

    <section class="grid">
      <div class="panel">
        <h2 class="title">내 기록</h2>

        <div class="profile">
          <div class="field">
            <label for="nickname">이름</label>
            <input id="nickname" autocomplete="nickname" placeholder="예: 수현" />
          </div>
          <div class="field">
            <label for="baseKg">내 기준값</label>
            <input id="baseKg" type="number" step="0.01" inputmode="decimal" placeholder="예: 70.0" />
          </div>
        </div>

        <div class="field">
          <label for="todayKg">오늘 내 숫자</label>
          <input id="todayKg" type="number" step="0.01" inputmode="decimal" placeholder="나만 보는 오늘 값" />
        </div>

        <div class="field">
          <label for="statusText">상태메시지</label>
          <textarea id="statusText" maxlength="80" placeholder="예: 오늘은 산책 성공. 야식 참는 중."></textarea>
        </div>

        <div class="actions">
          <button class="btn secondary" id="saveStatusBtn">말풍선만 저장</button>
          <button class="btn primary" id="saveBtn">변화량 게시</button>
        </div>

        <p class="hint">입력한 실제 숫자는 이 기기에만 저장돼요. Firestore에는 +n/-n 변화량과 말풍선만 올라갑니다.</p>

        <div class="me-summary">
          <div class="metric"><span>기준 대비</span><strong id="myTotal">-</strong></div>
          <div class="metric"><span>어제 대비</span><strong id="myDay">-</strong></div>
          <div class="metric"><span>7일 전 대비</span><strong id="myWeek">-</strong></div>
        </div>
      </div>

      <div class="panel">
        <h2 class="title">친구들</h2>
        <div class="members" id="members"></div>
      </div>
    </section>
  </main>

  <div class="toast" id="toast"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
    import {
      getFirestore,
      collection,
      doc,
      onSnapshot,
      orderBy,
      query,
      serverTimestamp,
      setDoc,
    } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDpmmoDqNt7E60amZK3EtTLMS-aIF7D8Qw",
      authDomain: "weight-log-9e860.firebaseapp.com",
      projectId: "weight-log-9e860",
      storageBucket: "weight-log-9e860.firebasestorage.app",
      messagingSenderId: "122504199756",
      appId: "1:122504199756:web:2c69dc0aa9a5b7d5b5fee9",
      measurementId: "G-59SYNQTCB8",
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const params = new URLSearchParams(location.search);
    const roomId = (params.get("room") || "default").replace(/[^\w-]/g, "").slice(0, 40) || "default";
    const storageKey = `weightRoom.${roomId}.v1`;
    const memberKey = `weightRoom.${roomId}.memberId`;

    const todayKey = () => {
      const d = new Date();
      const pad = (n) => String(n).padStart(2, "0");
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    };

    const daysAgoKey = (days) => {
      const d = new Date();
      d.setDate(d.getDate() - days);
      const pad = (n) => String(n).padStart(2, "0");
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    };

    const round2 = (value) => Math.round(value * 100) / 100;

    const formatDelta = (value) => {
      if (value == null || Number.isNaN(value)) return "-";
      const sign = value > 0 ? "+" : "";
      return `${sign}${value.toFixed(2)}kg`;
    };

    const deltaClass = (value) => {
      if (value == null || Number.isNaN(value) || Math.abs(value) < 0.005) return "";
      return value > 0 ? "up" : "down";
    };

    const loadLocal = () => {
      try {
        const saved = JSON.parse(localStorage.getItem(storageKey) || "{}");
        return {
          nickname: saved.nickname || "",
          baseKg: saved.baseKg || "",
          statusText: saved.statusText || "",
          entries: Array.isArray(saved.entries) ? saved.entries : [],
        };
      } catch {
        return { nickname: "", baseKg: "", statusText: "", entries: [] };
      }
    };

    const saveLocal = () => {
      localStorage.setItem(storageKey, JSON.stringify(localState));
    };

    const getMemberId = () => {
      let id = localStorage.getItem(memberKey);
      if (!id) {
        id = crypto.randomUUID();
        localStorage.setItem(memberKey, id);
      }
      return id;
    };

    const localState = loadLocal();
    const memberId = getMemberId();

    const $ = (id) => document.getElementById(id);
    $("roomName").textContent = roomId;
    $("nickname").value = localState.nickname;
    $("baseKg").value = localState.baseKg;
    $("statusText").value = localState.statusText;

    const findEntry = (date) => localState.entries.find((entry) => entry.date === date);
    const sortedEntries = () => [...localState.entries].sort((a, b) => a.date.localeCompare(b.date));

    function computeDeltas(todayKg) {
      const base = Number(localState.baseKg);
      const yesterday = findEntry(daysAgoKey(1));
      const week = findEntry(daysAgoKey(7));
      return {
        totalDelta: Number.isFinite(base) ? round2(todayKg - base) : null,
        dayDelta: yesterday ? round2(todayKg - yesterday.kg) : null,
        weekDelta: week ? round2(todayKg - week.kg) : null,
      };
    }

    function renderMine() {
      const latest = sortedEntries().at(-1);
      if ($("todayKg").value === "" && latest) $("todayKg").value = latest.kg.toFixed(2);
      const kg = Number($("todayKg").value || latest?.kg);
      const deltas = Number.isFinite(kg) ? computeDeltas(kg) : { totalDelta: null, dayDelta: null, weekDelta: null };

      $("myTotal").textContent = formatDelta(deltas.totalDelta);
      $("myTotal").className = deltaClass(deltas.totalDelta);
      $("myDay").textContent = formatDelta(deltas.dayDelta);
      $("myDay").className = deltaClass(deltas.dayDelta);
      $("myWeek").textContent = formatDelta(deltas.weekDelta);
      $("myWeek").className = deltaClass(deltas.weekDelta);
    }

    function showToast(message) {
      const toast = $("toast");
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove("show"), 1600);
    }

    async function publish({ includeWeight }) {
      localState.nickname = $("nickname").value.trim() || "익명";
      localState.baseKg = $("baseKg").value;
      localState.statusText = $("statusText").value.trim();

      const kg = Number($("todayKg").value);
      let payload = {
        memberId,
        nickname: localState.nickname,
        statusText: localState.statusText,
        updatedAt: serverTimestamp(),
      };

      if (includeWeight) {
        if (!Number.isFinite(kg)) {
          showToast("오늘 내 숫자를 입력해 주세요");
          return;
        }

        const date = todayKey();
        const entry = { date, kg: round2(kg), ts: Date.now() };
        const index = localState.entries.findIndex((item) => item.date === date);
        if (index >= 0) localState.entries[index] = entry;
        else localState.entries.push(entry);

        const deltas = computeDeltas(entry.kg);
        payload = {
          ...payload,
          totalDelta: deltas.totalDelta,
          dayDelta: deltas.dayDelta,
          weekDelta: deltas.weekDelta,
          lastLoggedDate: date,
        };
      }

      saveLocal();
      renderMine();
      await setDoc(doc(db, "rooms", roomId, "members", memberId), payload, { merge: true });
      showToast(includeWeight ? "변화량 게시됨" : "말풍선 저장됨");
    }

    function relativeTime(value) {
      const date = value?.toDate?.();
      if (!date) return "";
      const seconds = Math.max(1, Math.round((Date.now() - date.getTime()) / 1000));
      if (seconds < 60) return "방금";
      const minutes = Math.round(seconds / 60);
      if (minutes < 60) return `${minutes}분 전`;
      const hours = Math.round(minutes / 60);
      if (hours < 24) return `${hours}시간 전`;
      return `${Math.round(hours / 24)}일 전`;
    }

    function renderMembers(snapshot) {
      const members = snapshot.docs.map((item) => item.data());
      if (!members.length) {
        $("members").innerHTML = '<div class="empty">아직 아무도 없어요.<br />친구에게 이 URL을 보내보세요.</div>';
        return;
      }

      $("members").innerHTML = members.map((member) => {
        const isMe = member.memberId === memberId;
        const status = member.statusText || "오늘 상태메시지가 아직 없어요.";
        return `
          <article class="member">
            <div class="member-head">
              <div class="name">${escapeHtml(member.nickname || "익명")}${isMe ? " · 나" : ""}</div>
              <div class="updated">${relativeTime(member.updatedAt)}</div>
            </div>
            <div class="delta-row">
              <div class="delta"><small>기준 대비</small><b class="${deltaClass(member.totalDelta)}">${formatDelta(member.totalDelta)}</b></div>
              <div class="delta"><small>어제 대비</small><b class="${deltaClass(member.dayDelta)}">${formatDelta(member.dayDelta)}</b></div>
              <div class="delta"><small>7일 전 대비</small><b class="${deltaClass(member.weekDelta)}">${formatDelta(member.weekDelta)}</b></div>
            </div>
            <div class="bubble">${escapeHtml(status)}</div>
          </article>
        `;
      }).join("");
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    ["nickname", "baseKg", "todayKg", "statusText"].forEach((id) => {
      $(id).addEventListener("input", renderMine);
    });

    $("saveBtn").addEventListener("click", () => publish({ includeWeight: true }));
    $("saveStatusBtn").addEventListener("click", () => publish({ includeWeight: false }));

    renderMine();
    onSnapshot(
      query(collection(db, "rooms", roomId, "members"), orderBy("updatedAt", "desc")),
      renderMembers,
      (error) => {
        console.error(error);
        $("members").innerHTML = '<div class="empty">Firestore 연결을 확인해 주세요.<br />규칙 또는 프로젝트 설정 문제일 수 있어요.</div>';
      },
    );
  </script>
</body>
</html>
